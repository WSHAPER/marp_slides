# Local pre-commit gates: the SAME tools as scripts/check.sh and CI, so a
# green commit locally means a green pipeline. Install once with:
#   pre-commit install
# Run all gates on demand with:
#   pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # The remaining gates run from the project venv (requirements_dev.txt)
  # so the pinned versions in this repo are the versions that check.
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: import-linter
        name: import-linter (layering, facade, framework-free core)
        entry: .venv/bin/lint-imports
        language: system
        pass_filenames: false

      - id: vulture
        name: vulture (dead code, min-confidence 90)
        entry: .venv/bin/vulture --config pyproject.toml
        language: system
        pass_filenames: false

      - id: prompts-data-only
        name: marp_slides/prompts stays data-only
        entry: >-
          bash -c '[[ -n "$(find marp_slides/prompts -name "*.py" -print -quit)" ]] && { echo "FAIL: python in prompts/"; exit 1; }; [[ -f marp_slides/prompts/deck_system_prompt.md && -f marp_slides/prompts/deck_skeleton.md ]] || { echo "FAIL: required prompt file missing"; exit 1; }'
        language: system
        pass_filenames: false
        files: ^marp_slides/prompts/
